syntax = "proto3";
package syreen.syreenmint.v1;

import "amino/amino.proto";
import "gogoproto/gogo.proto";
import "syreen/syreenmint/v1/params.proto";

option go_package = "syreen/x/syreenmint/types";

// GenesisState defines the syreenmint module's genesis state.
message GenesisState {
  // params defines all the parameters of the module.
  Params params = 1 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
}
